services:
  panway:
    build: .
    image: jhopan/panway:latest
    container_name: panway
    restart: unless-stopped
    command: ["--log-dir", "/data/logs"]
    environment:
      PORT: "3000"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      SQLITE_PATH: "/data/panway.db"
      SQLITE_BACKUP_ENABLED: "true"
      SQLITE_BACKUP_DIR: "/data/backups"
      SQLITE_BACKUP_KEEP: "14"
      LOG_RETENTION_DAYS: "90"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      HSTS_MAX_AGE: "${HSTS_MAX_AGE:-31536000}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1}"
      ENABLE_METRICS: "true"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: panway-nginx
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - panway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

  # Optional Redis. Enable with: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: panway-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data